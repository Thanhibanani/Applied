services:
  postgres:
    image: postgres:16-alpine
    container_name: applied-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: applied
      POSTGRES_USER: applied
      POSTGRES_PASSWORD: applied_dev_password
    ports:
      - "5432:5432"
    volumes:
      - applied-postgres-data:/var/lib/postgresql/data

volumes:
  applied-postgres-data:
